name: Build Plugin ZIPs

on:
  push:
    branches: [main]
    # Trigger when any plugin's source or manifest changes.
    paths:
      - "*/plugin.toml"
      - "*/**/*.py"
      - "*/**/help/*.md"
      - "build_plugins.py"
      - ".github/workflows/build-plugin.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create releases and commit plugins.json

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build all plugin ZIPs and update plugins.json
        run: python build_plugins.py

      # ZIPs are not committed (they made every merge conflict); each plugin
      # version gets a release "<name>-v<version>" holding its ZIP, which is
      # what plugins.json's download_url points at. Re-running for an
      # unchanged version replaces the asset.
      - name: Publish ZIPs as release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for zip in */dist/galileo-plugin-*.zip; do
            name=$(basename "$zip" .zip)
            name=${name#galileo-plugin-}
            version=${name##*-}
            plugin=${name%-*}
            tag="${plugin}-v${version}"
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" "$zip" --clobber
            else
              gh release create "$tag" "$zip" --title "$plugin $version"                 --notes "Galileo plugin $plugin $version. Installed from the Galileo plugin Marketplace."
            fi
          done

      - name: Commit plugins.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "ci: update plugins.json [skip ci]"
          file_pattern: "plugins.json"
