name: Build Skyshot engine

# Builds the Skyshot solver (github.com/ashtree74/skyshot-solver, Apache-2.0) from one pinned upstream
# commit on every platform Galileo supports, using upstream's own packager and its smoke test, and
# optionally publishes the archives as a release that the skyshot_solver plugin downloads from.
#
# Run by hand (Actions > Build Skyshot engine). Nothing is published unless "publish" is ticked.
# After publishing, commit the generated skyshot_solver/skyshot_solver/engine_builds.py (attached to the
# release) and bump the plugin version: the plugin trusts only the SHA-256 values pinned in that file,
# not the release page.

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Upstream commit to build (full 40-character SHA; there are no upstream tags yet)"
        required: true
        default: "76f01812fe0fc0fcdcbeba1ab89b339b19e1bc9e"
      publish:
        description: "Publish the archives as a GitHub release"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }   # Raspberry Pi 5-class
          - { os: macos-14, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Check the commit is a full SHA
        shell: bash
        run: |
          [[ "${{ inputs.commit }}" =~ ^[0-9a-f]{40}$ ]] || { echo "commit must be a 40-character SHA"; exit 1; }

      - uses: actions/checkout@v4
        with:
          repository: ashtree74/skyshot-solver
          ref: ${{ inputs.commit }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The toolchain upstream's own CI uses; rust-docs is needed because the packager bundles Rust's licences.
      - run: rustup toolchain install 1.95.0 --profile minimal --component rust-docs
      - run: rustup default 1.95.0

      - run: cargo test --locked --all-targets
      - run: cargo build --locked --release
      - run: cargo run --release --locked --example synthetic_demo -- demo

      - name: "Package with upstream's packager (binary, licences, notices, checksums)"
        run: python tools/package_cli.py --target host --out outputs/candidate

      - name: Unpack the archive and solve the synthetic demo with the packaged binary
        run: python tools/check_candidate.py --directory outputs/candidate --demo demo

      - name: The archive must be for this matrix target
        shell: bash
        run: ls outputs/candidate | grep -F -- "-${{ matrix.target }}."

      - uses: actions/upload-artifact@v4
        with:
          name: skyshot-${{ matrix.target }}
          path: outputs/candidate/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: build
    if: ${{ inputs.publish }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write          # create the release; this job never runs upstream code
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: archives
          pattern: skyshot-*
          merge-multiple: true

      - name: Describe the archives and write the plugin's pinned list
        run: |
          python - <<'EOF'
          import hashlib, json, pathlib, re
          commit = "${{ inputs.commit }}"
          builds, version = {}, None
          for path in sorted(pathlib.Path("archives").glob("skyshot-*")):
              if path.suffix == ".sha256":
                  continue
              m = re.fullmatch(r"skyshot-(\d+\.\d+\.\d+)-(.+?)\.(zip|tar\.gz)", path.name)
              if not m:
                  raise SystemExit(f"unexpected file {path.name}")
              version = version or m.group(1)
              assert version == m.group(1), "archives are for different versions"
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              published = path.with_name(path.name + ".sha256").read_text().split()[0]
              assert digest == published, f"{path.name}: checksum file disagrees"
              builds[m.group(2)] = {"archive": path.name, "bytes": path.stat().st_size, "sha256": digest}
          assert len(builds) == 4, f"expected 4 targets, found {sorted(builds)}"
          tag = f"skyshot-engine-v{version}-{commit[:7]}"
          lines = [
              "# Generated by .github/workflows/skyshot-engine.yml. Do not edit by hand.",
              '"""The Skyshot program builds this plugin version trusts (SKY-080): upstream commit, release,',
              'and the SHA-256 of each archive. A download that does not match is discarded."""',
              "",
              f"ENGINE_VERSION = {version!r}",
              f"UPSTREAM_COMMIT = {commit!r}",
              f"RELEASE_TAG = {tag!r}",
              "RELEASE_BASE_URL = " + repr(f"https://github.com/${{ github.repository }}/releases/download/{tag}/"),
              "",
              "BUILDS = " + json.dumps(builds, indent=4, sort_keys=True).replace("true", "True"),
              "",
          ]
          pathlib.Path("archives/engine_builds.py").write_text("\n".join(lines), encoding="utf-8")
          pathlib.Path("tag.txt").write_text(tag)
          EOF
          cat archives/engine_builds.py

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$(cat tag.txt)
          gh release create "$tag" archives/* \
            --repo "${{ github.repository }}" \
            --title "Skyshot engine $tag" \
            --notes "Unmodified builds of [Skyshot Solver](https://github.com/ashtree74/skyshot-solver), Copyright 2026 Adam Jesionkiewicz, licensed under the Apache License 2.0, upstream commit ${{ inputs.commit }}, built by CI on each platform from that commit. Each archive carries Skyshot's LICENSE, NOTICE and third-party notices, which must stay with the program. Not part of, or endorsed by, the Skyshot project. The star indexes are a separate download with their own terms and are not included. Unsigned and not notarized. Used by the Galileo skyshot_solver plugin, which checks each download against SHA-256 values pinned in the plugin; download by hand only if you know why."
