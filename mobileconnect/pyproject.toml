[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "galileo-plugin-mobileconnect"
version = "0.1.0"
description = "MobileConnect: the server side of the Galileo MobileConnect apps (draft)"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Gord Tulloch", email = "gtulloch@sunrisesd.ca" }]
requires-python = ">=3.11"
dependencies = ["galileo"]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
where = ["."]
include = ["mobileconnect*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"

[tool.mypy]
python_version = "3.11"
