[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "galileo-plugin-switchbot-bot"
version = "1.0.0"
description = "SwitchBot Bot (Bluetooth LE) switch plugin for Galileo"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Gord Tulloch", email = "gtulloch@sunrisesd.ca" }]
requires-python = ">=3.11"
dependencies = [
    "galileo",          # provides PluginBase, galileo.core.devices
    "bleak>=0.21",      # cross-platform Bluetooth LE (Windows/macOS/Linux)
]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
where = ["."]
include = ["switchbot_bot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"

[tool.mypy]
python_version = "3.11"
